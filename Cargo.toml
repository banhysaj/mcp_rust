[package]
name = "mcp-async"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "MCP server library with worker-pool tool dispatch, cooperative cancellation, and stdio and Streamable HTTP transports"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/mcp-async"
keywords = ["mcp", "model-context-protocol", "jsonrpc", "server", "http"]
categories = ["network-programming", "web-programming::http-server"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
